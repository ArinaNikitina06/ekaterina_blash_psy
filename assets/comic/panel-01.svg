<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520">
  <defs>
    <filter id="blur18" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" />
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#232129" flood-opacity="0.10" />
    </filter>
    <style>
      .paper { fill: #f3efe6; }
      .surface { fill: #fbfaf7; }
      .sage { fill: #6f7f6a; }
      .lav { fill: #7c7af0; }
      .gold { fill: #d6bb7a; }
      .line { stroke: #232129; stroke-opacity: 0.10; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    </style>
  </defs>

  <rect class="paper" x="0" y="0" width="900" height="520" rx="26" />

  <!-- мягкие акварельные пятна -->
  <g filter="url(#blur18)" opacity="0.95">
    <ellipse cx="205" cy="120" rx="240" ry="160" fill="#6f7f6a" opacity="0.16" />
    <ellipse cx="720" cy="120" rx="260" ry="170" fill="#d6bb7a" opacity="0.16" />
    <ellipse cx="720" cy="360" rx="300" ry="180" fill="#7c7af0" opacity="0.10" />
  </g>

  <!-- table -->
  <g filter="url(#shadow)">
    <rect x="210" y="260" width="480" height="120" rx="20" class="surface" fill-opacity="0.85" stroke="#232129" stroke-opacity="0.10" />
    <rect x="255" y="290" width="390" height="14" rx="7" fill="#232129" fill-opacity="0.05" />
  </g>
  <path class="line" d="M250 380c60 26 120 38 200 38s140-12 200-38" />

  <!-- золотая “лента” -->
  <path d="M150 210c90-70 190-92 310-76 86 12 152 44 290 10"
        stroke="#d6bb7a" stroke-width="14" stroke-linecap="round" stroke-opacity="0.35" fill="none" />
  <path d="M150 210c90-70 190-92 310-76 86 12 152 44 290 10"
        stroke="#d6bb7a" stroke-width="3" stroke-linecap="round" stroke-opacity="0.55" fill="none" />

  <!-- Partner A (left) -->
  <g transform="translate(135,190)">
    <path d="M110 92c-44 18-70 58-74 106h184c-6-62-44-94-110-106Z" fill="#6f7f6a" opacity="0.22"/>
    <ellipse cx="120" cy="62" rx="42" ry="46" fill="#f2e2d6" opacity="0.96"/>
    <path d="M84 52c18-34 70-42 92-8 8 14 10 28 8 40-10-18-28-30-52-30-22 0-38 8-48 22Z" fill="#232129" opacity="0.10"/>
    <path class="line" d="M104 74c10 8 20 8 30 0" />
  </g>

  <!-- Therapist (right) -->
  <g transform="translate(620,180)">
    <path d="M60 92c-26 14-42 38-46 84h132c-4-46-20-70-46-84-14 10-24 16-40 16s-26-6-40-16Z" fill="#7c7af0" opacity="0.12"/>
    <ellipse cx="60" cy="58" rx="40" ry="46" fill="#f2e2d6" opacity="0.96"/>
    <!-- hair: short, wavy (узнаваемый силуэт без портретной детализации) -->
    <path d="M24 58c-6-30 10-56 40-62 22-4 46 8 56 26 10 18 10 38-2 54-6-10-14-18-26-22-18-6-40-2-54 12-4 4-8 8-14 12Z"
          fill="#3a2a2a" opacity="0.42"/>
    <path class="line" d="M44 62c8 8 16 8 24 0" />
    <path class="line" d="M46 74c10 6 20 6 28 0" />
  </g>

  <!-- Partner B (far right chair hint) -->
  <g transform="translate(705,300)" opacity="0.8">
    <path d="M40 40c-20 10-32 26-34 58h100c-2-32-14-48-34-58-10 6-18 10-32 10s-22-4-32-10Z" fill="#6f7f6a" opacity="0.12"/>
    <ellipse cx="40" cy="24" rx="22" ry="24" fill="#f2e2d6" opacity="0.96"/>
    <path d="M22 24c0-16 12-30 30-30 14 0 26 8 30 20-6-6-14-10-24-10-14 0-26 8-36 20Z" fill="#232129" opacity="0.08"/>
  </g>

  <!-- subtle linework -->
  <path class="line" d="M168 250c40-40 100-64 160-64 82 0 126 24 180 24s92-22 142-54" />
</svg>

