<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520">
  <defs>
    <filter id="blur18" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" />
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#232129" flood-opacity="0.10" />
    </filter>
  </defs>
  <rect x="0" y="0" width="900" height="520" rx="26" fill="#f3efe6" />
  <g filter="url(#blur18)" opacity="0.95">
    <ellipse cx="220" cy="140" rx="280" ry="190" fill="#6f7f6a" opacity="0.14" />
    <ellipse cx="700" cy="120" rx="320" ry="210" fill="#d6bb7a" opacity="0.16" />
    <ellipse cx="650" cy="380" rx="340" ry="220" fill="#7c7af0" opacity="0.10" />
  </g>

  <!-- “cycle” appears between -->
  <g filter="url(#shadow)">
    <circle cx="450" cy="210" r="72" fill="#fbfaf7" fill-opacity="0.85" stroke="#232129" stroke-opacity="0.10" />
  </g>
  <circle cx="450" cy="210" r="58" fill="#d6bb7a" opacity="0.16" />
  <path d="M420 190c18-14 44-14 62 0 18 14 22 34 12 54-12 22-38 30-62 22-20-6-34-26-32-46"
        stroke="#6f7f6a" stroke-width="10" stroke-linecap="round" stroke-opacity="0.28" fill="none"/>

  <!-- table -->
  <g filter="url(#shadow)">
    <rect x="190" y="300" width="520" height="86" rx="20" fill="#fbfaf7" fill-opacity="0.88" stroke="#232129" stroke-opacity="0.10" />
  </g>

  <!-- A / therapist / B -->
  <g opacity="0.96">
    <g transform="translate(190,302)">
      <ellipse cx="70" cy="30" rx="28" ry="30" fill="#f2e2d6"/>
      <path d="M70 66c-38 10-52 32-56 72h112c-4-40-18-62-56-72Z" fill="#6f7f6a" opacity="0.22"/>
    </g>
    <g transform="translate(420,290)">
      <ellipse cx="56" cy="28" rx="26" ry="30" fill="#f2e2d6"/>
      <path d="M56 62c-28 10-40 28-42 66h84c-2-38-14-56-42-66Z" fill="#7c7af0" opacity="0.10"/>
      <path d="M32 30c2-18 18-32 38-32 16 0 30 10 34 22-8-8-18-12-30-12-14 0-28 6-42 22Z" fill="#3a2a2a" opacity="0.30"/>
    </g>
    <g transform="translate(610,302)">
      <ellipse cx="70" cy="30" rx="28" ry="30" fill="#f2e2d6"/>
      <path d="M70 66c-38 10-52 32-56 72h112c-4-40-18-62-56-72Z" fill="#6f7f6a" opacity="0.14"/>
    </g>
  </g>

  <!-- gold ribbon -->
  <path d="M130 160c120-72 250-90 370-60 100 24 190 60 300 24"
        stroke="#d6bb7a" stroke-width="12" stroke-linecap="round" stroke-opacity="0.22" fill="none" />
</svg>

