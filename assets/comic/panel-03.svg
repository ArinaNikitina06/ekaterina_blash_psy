<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520">
  <defs>
    <filter id="blur18" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" />
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#232129" flood-opacity="0.10" />
    </filter>
  </defs>
  <rect x="0" y="0" width="900" height="520" rx="26" fill="#f3efe6" />
  <g filter="url(#blur18)" opacity="0.95">
    <ellipse cx="240" cy="140" rx="280" ry="180" fill="#d6bb7a" opacity="0.14" />
    <ellipse cx="690" cy="140" rx="280" ry="180" fill="#6f7f6a" opacity="0.14" />
    <ellipse cx="540" cy="380" rx="340" ry="210" fill="#7c7af0" opacity="0.10" />
  </g>

  <!-- table -->
  <g filter="url(#shadow)">
    <rect x="180" y="290" width="540" height="92" rx="20" fill="#fbfaf7" fill-opacity="0.88" stroke="#232129" stroke-opacity="0.10" />
  </g>

  <!-- opposing “speech” blocks -->
  <g opacity="0.92">
    <rect x="130" y="200" width="300" height="86" rx="20" fill="#fbfaf7" fill-opacity="0.86" stroke="#232129" stroke-opacity="0.08"/>
