      <path d="M70 66c-38 10-52 32-56 72h112c-4-40-18-62-56-72Z" fill="#6f7f6a" opacity="0.14"/>
      <path d="M54 22c8-16 24-24 42-22 18 2 30 12 32 24-8-6-16-10-26-10-14 0-28 6-48 22Z" fill="#232129" opacity="0.08"/>
    </g>
