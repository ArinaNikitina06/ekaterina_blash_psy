    <path d="M220 258c34-16 68-22 96-18" stroke="#232129" stroke-opacity="0.14" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M560 238c42-22 88-26 130-10" stroke="#232129" stroke-opacity="0.14" stroke-width="3" stroke-linecap="round" fill="none"/>
  </g>

  <!-- gold “tension line” -->
