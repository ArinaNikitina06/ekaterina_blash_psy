<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520">
  <defs>
    <filter id="blur18" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" />
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#232129" flood-opacity="0.10" />
    </filter>
  </defs>
  <rect x="0" y="0" width="900" height="520" rx="26" fill="#f3efe6" />
  <g filter="url(#blur18)" opacity="0.95">
    <ellipse cx="170" cy="130" rx="260" ry="170" fill="#6f7f6a" opacity="0.16" />
    <ellipse cx="720" cy="140" rx="290" ry="190" fill="#d6bb7a" opacity="0.16" />
    <ellipse cx="640" cy="380" rx="320" ry="200" fill="#7c7af0" opacity="0.10" />
  </g>

  <!-- golden ribbon -->
  <path d="M120 200c120-76 250-92 370-64 96 22 170 56 320 18"
        stroke="#d6bb7a" stroke-width="14" stroke-linecap="round" stroke-opacity="0.32" fill="none" />
  <path d="M120 200c120-76 250-92 370-64 96 22 170 56 320 18"
        stroke="#d6bb7a" stroke-width="3" stroke-linecap="round" stroke-opacity="0.55" fill="none" />

  <!-- table -->
  <g filter="url(#shadow)">
    <rect x="190" y="270" width="520" height="110" rx="20" fill="#fbfaf7" fill-opacity="0.88" stroke="#232129" stroke-opacity="0.10" />
  </g>

  <!-- partner A bubble hint -->
  <g transform="translate(120,250)">
    <ellipse cx="150" cy="34" rx="110" ry="30" fill="#fbfaf7" fill-opacity="0.85" stroke="#232129" stroke-opacity="0.08"/>
    <circle cx="90" cy="34" r="4" fill="#232129" fill-opacity="0.18"/>
    <circle cx="120" cy="34" r="4" fill="#232129" fill-opacity="0.18"/>
    <circle cx="150" cy="34" r="4" fill="#232129" fill-opacity="0.18"/>
  </g>

  <!-- partner B bubble hint -->
  <g transform="translate(520,250)">
    <ellipse cx="150" cy="34" rx="110" ry="30" fill="#fbfaf7" fill-opacity="0.85" stroke="#232129" stroke-opacity="0.08"/>
    <circle cx="110" cy="34" r="4" fill="#232129" fill-opacity="0.18"/>
    <circle cx="140" cy="34" r="4" fill="#232129" fill-opacity="0.18"/>
    <circle cx="170" cy="34" r="4" fill="#232129" fill-opacity="0.18"/>
  </g>

  <!-- people (soft) -->
  <g opacity="0.96">
    <!-- A -->
    <g transform="translate(150,300)">
      <ellipse cx="70" cy="30" rx="28" ry="30" fill="#f2e2d6"/>
      <path d="M70 66c-38 10-52 32-56 72h112c-4-40-18-62-56-72Z" fill="#6f7f6a" opacity="0.22"/>
      <path d="M44 26c6-18 24-28 44-26 18 2 30 14 34 28-10-10-22-14-34-14-16 0-32 6-44 24Z" fill="#232129" opacity="0.08"/>
    </g>
    <!-- therapist -->
    <g transform="translate(420,286)">
      <ellipse cx="56" cy="28" rx="26" ry="30" fill="#f2e2d6"/>
      <path d="M56 62c-28 10-40 28-42 66h84c-2-38-14-56-42-66Z" fill="#7c7af0" opacity="0.10"/>
      <path d="M32 30c2-18 18-32 38-32 16 0 30 10 34 22-8-8-18-12-30-12-14 0-28 6-42 22Z" fill="#3a2a2a" opacity="0.30"/>
    </g>
    <!-- B -->
    <g transform="translate(670,300)">
      <ellipse cx="70" cy="30" rx="28" ry="30" fill="#f2e2d6"/>
      <path d="M70 66c-38 10-52 32-56 72h112c-4-40-18-62-56-72Z" fill="#6f7f6a" opacity="0.14"/>
      <path d="M50 20c8-16 24-24 42-22 18 2 30 12 32 24-8-6-16-10-26-10-14 0-28 6-48 22Z" fill="#232129" opacity="0.08"/>
    </g>
  </g>
</svg>

