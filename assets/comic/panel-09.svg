<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520">
  <defs>
    <filter id="blur18" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" />
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#232129" flood-opacity="0.10" />
    </filter>
  </defs>
  <rect x="0" y="0" width="900" height="520" rx="26" fill="#f3efe6" />
  <g filter="url(#blur18)" opacity="0.95">
    <ellipse cx="240" cy="140" rx="320" ry="220" fill="#6f7f6a" opacity="0.14" />
    <ellipse cx="720" cy="140" rx="320" ry="220" fill="#d6bb7a" opacity="0.16" />
    <ellipse cx="520" cy="390" rx="360" ry="240" fill="#7c7af0" opacity="0.10" />
  </g>

  <!-- broken cycle -->
  <g filter="url(#shadow)">
    <circle cx="450" cy="210" r="74" fill="#fbfaf7" fill-opacity="0.90" stroke="#232129" stroke-opacity="0.10"/>
  </g>
  <path d="M420 190c18-14 44-14 62 0 16 12 22 28 16 44" stroke="#6f7f6a" stroke-width="10" stroke-linecap="round" stroke-opacity="0.22" fill="none"/>
  <path d="M404 238c-10-18-8-38 10-54" stroke="#d6bb7a" stroke-width="10" stroke-linecap="round" stroke-opacity="0.22" fill="none"/>
  <path d="M540 230l28 12" stroke="#232129" stroke-opacity="0.16" stroke-width="4" stroke-linecap="round"/>
  <path d="M356 210l-26 -16" stroke="#232129" stroke-opacity="0.16" stroke-width="4" stroke-linecap="round"/>

  <!-- table -->
  <g filter="url(#shadow)">
    <rect x="190" y="310" width="520" height="86" rx="20" fill="#fbfaf7" fill-opacity="0.90" stroke="#232129" stroke-opacity="0.10" />
  </g>

  <!-- A and B closer -->
  <g opacity="0.96">
    <g transform="translate(250,312)">
      <ellipse cx="70" cy="30" rx="28" ry="30" fill="#f2e2d6"/>
      <path d="M70 66c-38 10-52 32-56 72h112c-4-40-18-62-56-72Z" fill="#6f7f6a" opacity="0.20"/>
    </g>
    <g transform="translate(560,312)">
      <ellipse cx="70" cy="30" rx="28" ry="30" fill="#f2e2d6"/>
      <path d="M70 66c-38 10-52 32-56 72h112c-4-40-18-62-56-72Z" fill="#6f7f6a" opacity="0.14"/>
    </g>
  </g>

  <!-- gold ribbon -->
  <path d="M140 160c120-72 250-90 370-60 100 24 190 60 300 24"
        stroke="#d6bb7a" stroke-width="12" stroke-linecap="round" stroke-opacity="0.18" fill="none" />
</svg>

